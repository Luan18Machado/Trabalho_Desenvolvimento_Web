
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flappy Acadêmico</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <h1>Flappy Acadêmico</h1>

    <h3>
        Pontos: <span id="pontos">0</span>
    </h3>

    <!-- Campo do nome do jogador -->
    <div id="cadastro">
        <label for="nomeJogador">Nome do jogador:</label>

        <input
            type="text"
            id="nomeJogador"
            placeholder="Digite seu nome"
            maxlength="100"
            required
        >
    </div>

    <!-- Área do jogo -->
    <div id="jogo">

        <div id="mundo">

            <div id="cenarios">

                <img src="fundo.png" class="fundo" id="fundo1">

                <img src="fundocd.png" class="fundo" id="fundo2">

            </div>

            <img src="professor.png" id="professor">

            <h2 id="fim">Fim de jogo!</h2>

        </div>

    </div>

    <!-- Botão para reiniciar -->
    <button id="reiniciar">
        Jogar novamente
    </button>

    <p id="instrucao">
        Use ESPAÇO ou toque na tela para voar!
    </p>

    <!-- JavaScript do jogo -->
    <script src="java.js"></script>

</body>

</html>
